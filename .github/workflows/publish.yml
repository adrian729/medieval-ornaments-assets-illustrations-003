name: Publish approved resources
on:
  workflow_dispatch:
    inputs:
      check-authentication:
        description: Verify npm OIDC without publishing
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: resource-publication
  cancel-in-progress: false
jobs:
  publish:
    uses: adrian729/medieval-ornaments/.github/workflows/publish-resource.yml@8a59657b7b0727019d68399e0c5ed28e0e1a7bdd
    with:
      source: illustrations-003
      tooling-ref: 8a59657b7b0727019d68399e0c5ed28e0e1a7bdd
      check-authentication: ${{ inputs.check-authentication }}
